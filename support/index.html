<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2738;--sub:#5b6880;--line:#cfd7e4;--pri:#1f4e8c;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
h1{margin:0 0 6px;font-size:18px}
p{margin:0 0 16px;font-size:13px;color:var(--sub)}
input[type=password]{width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:6px}
label{display:flex;gap:6px;align-items:center;margin:10px 0 14px;font-size:13px;color:var(--sub)}
button{width:100%;padding:10px;font-size:15px;font-weight:600;color:#fff;background:var(--pri);border:0;border-radius:6px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#m{min-height:18px;margin:10px 0 0;font-size:13px;color:var(--err)}
</style></head><body>

<script>
(function(){
var SK='plan-sim-key-support',ITER=600000;
function bin(s){var a=atob(s),u=new Uint8Array(a.length);for(var i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u;}
function b64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
var P=document.getElementById('d').textContent.trim().split('.'),salt=bin(P[0]),iv=bin(P[1]),ct=bin(P[2]);
var ready=new Promise(function(r){if(document.readyState==='complete')r();else window.addEventListener('load',function(){r();});});   // 파싱 중 document.open은 문서를 비우지 못함
function show(buf){return ready.then(function(){var h=new TextDecoder().decode(buf);document.open();document.write(h);document.close();});}
function dec(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct);}
function store(){return window.sessionStorage;}
function saved(){try{return store().getItem(SK);}catch(e){return null;}}
function put(v){try{store().setItem(SK,v);}catch(e){}}
function drop(){try{store().removeItem(SK);}catch(e){}}
var f=document.getElementById('f'),b=document.getElementById('b'),m=document.getElementById('m');
var s=saved();
if(s){f.style.visibility='hidden';crypto.subtle.importKey('raw',bin(s),'AES-GCM',false,['decrypt']).then(dec).then(show).catch(function(){drop();f.style.visibility='';});}
f.addEventListener('submit',function(e){
  e.preventDefault();
  if(!window.crypto||!crypto.subtle){m.textContent='이 브라우저에서는 열 수 없습니다. 최신 Chrome이나 Edge로 열어 주세요.';return;}
  b.disabled=true;m.textContent='';b.textContent='여는 중…';
  var keep=document.getElementById('r').checked;
  crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('p').value),'PBKDF2',false,['deriveKey'])
  .then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);})
  .then(function(k){return dec(k).then(function(buf){
    if(!keep)return buf;
    return crypto.subtle.exportKey('raw',k).then(function(r){put(b64(r));return buf;});
  });})
  .then(show)
  .catch(function(){b.disabled=false;b.textContent='열기';m.textContent='비밀번호가 맞지 않습니다.';});
});
})();
</script>
